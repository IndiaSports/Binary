<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time JavaScript Obfuscator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --surface: #11141d;
      --surface-hover: #161b27;
      --border: #1f2638;
      --border-focus: #3b82f6;
      --accent: #2563eb;
      --text: #f1f5f9;
      --text-muted: #8492a6;
      --code-bg: #07090e;
      --success: #10b981;
      --radius: 8px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1.5rem;
      line-height: 1.5;
    }
    .container {
      width: 100%;
      max-width: 1120px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    /* Header */
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .brand p {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 0.2rem;
    }
    .status-group {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--success);
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }
    /* Main Grid */
    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 860px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }
    .editor-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }
    .editor-card:focus-within {
      border-color: var(--border-focus);
    }
    .card-header {
      padding: 0.7rem 1rem;
      background: rgba(255, 255, 255, 0.015);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-header span {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    textarea {
      width: 100%;
      height: 460px;
      background: var(--code-bg);
      border: none;
      color: #e2e8f0;
      padding: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
    }
    .btn:hover {
      background: var(--surface-hover);
      border-color: #334155;
    }
    .btn-success {
      background: rgba(16, 185, 129, 0.15) !important;
      border-color: rgba(16, 185, 129, 0.4) !important;
      color: #34d399 !important;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <h1>Real-Time JavaScript Obfuscator</h1>
      <p>Clean string extraction, Unicode/Hex encoding aur crash-free IIFE execution.</p>
    </div>
    <div class="status-group">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Real-Time Active</span>
      </div>
    </div>
  </header>

  <div class="workspace">
    <!-- Input Section -->
    <div class="editor-card">
      <div class="card-header">
        <span>Raw JavaScript Input</span>
        <button class="btn" onclick="loadSample()">Load Sample</button>
      </div>
      <textarea id="raw-js" spellcheck="false" placeholder="// Type or paste your JavaScript code here..."></textarea>
    </div>

    <!-- Output Section -->
    <div class="editor-card">
      <div class="card-header">
        <span>Real-Time Obfuscated Output</span>
        <button id="copy-btn" class="btn" onclick="copyResult()">Copy Code</button>
      </div>
      <textarea id="out-js" readonly spellcheck="false" placeholder="Obfuscated code appears here instantly..."></textarea>
    </div>
  </div>
</div>

<script>
  const rawInput = document.getElementById('raw-js');
  const outArea = document.getElementById('out-js');
  let debounceTimer;

  rawInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(processRealtime, 80);
  });

  // Comprehensive Hex and Unicode encoder
  function toSafeEncoded(str) {
    let output = '';
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      if (code < 128) {
        output += '\\x' + code.toString(16).padStart(2, '0');
      } else {
        output += '\\u' + code.toString(16).padStart(4, '0');
      }
    }
    return output;
  }

  // Tokenizer-based parser that strips comments and extracts strings safely
  function transformSource(code) {
    let output = '';
    const stringPool = [];
    let i = 0;
    const len = code.length;

    while (i < len) {
      const char = code[i];
      const next = code[i + 1];

      // 1. Skip Single-line Comments
      if (char === '/' && next === '/') {
        i += 2;
        while (i < len && code[i] !== '\n' && code[i] !== '\r') {
          i++;
        }
        continue;
      }

      // 2. Skip Multi-line Comments
      if (char === '/' && next === '*') {
        i += 2;
        while (i < len && !(code[i] === '*' && code[i + 1] === '/')) {
          i++;
        }
        i += 2;
        continue;
      }

      // 3. Extract Single and Double Quote String Literals
      if (char === '"' || char === "'") {
        const quote = char;
        let strVal = '';
        i++; // skip opening quote

        while (i < len && code[i] !== quote) {
          if (code[i] === '\\' && i + 1 < len) {
            strVal += code[i] + code[i + 1];
            i += 2;
          } else {
            strVal += code[i];
            i++;
          }
        }
        i++; // skip closing quote

        if (strVal === '') {
          output += quote + quote;
        } else {
          let poolIndex = stringPool.indexOf(strVal);
          if (poolIndex === -1) {
            stringPool.push(strVal);
            poolIndex = stringPool.length - 1;
          }
          output += `_0x2b1c(${poolIndex})`;
        }
        continue;
      }

      // 4. Handle Template Literals (Backticks)
      if (char === '`') {
        let templateStr = '`';
        i++; // skip opening backtick
        let hasExpression = false;

        while (i < len && code[i] !== '`') {
          if (code[i] === '$' && code[i + 1] === '{') {
            hasExpression = true;
          }
          if (code[i] === '\\' && i + 1 < len) {
            templateStr += code[i] + code[i + 1];
            i += 2;
          } else {
            templateStr += code[i];
            i++;
          }
        }
        templateStr += '`';
        i++; // skip closing backtick

        // Agar expression (${...}) nahi hai toh hi pool me daalo, warna as-is rehne do
        if (!hasExpression) {
          const innerVal = templateStr.slice(1, -1);
          if (innerVal === '') {
            output += '``';
          } else {
            let poolIndex = stringPool.indexOf(innerVal);
            if (poolIndex === -1) {
              stringPool.push(innerVal);
              poolIndex = stringPool.length - 1;
            }
            output += `_0x2b1c(${poolIndex})`;
          }
        } else {
          output += templateStr;
        }
        continue;
      }

      // Default: copy character
      output += char;
      i++;
    }

    return { transformed: output, stringPool };
  }

  function processRealtime() {
    const raw = rawInput.value;
    if (!raw.trim()) {
      outArea.value = '';
      return;
    }

    try {
      const { transformed, stringPool } = transformSource(raw);

      // Build safe escaped tokens for the lookup array
      const hexTokens = stringPool.map(str => `"${toSafeEncoded(str)}"`);

      // Self-contained, crash-safe IIFE bundle
      const finalBundle = `;(function(){var _0x59a2=[${hexTokens.join(',')}];var _0x2b1c=function(idx){return _0x59a2[idx];};${transformed}\n})();`;

      outArea.value = finalBundle;
    } catch (err) {
      outArea.value = `// Obfuscation Error:\n${err.message}`;
    }
  }

  function copyResult() {
    if (!outArea.value || outArea.value.startsWith('// Obfuscation Error')) return;

    outArea.focus();
    outArea.select();
    try {
      navigator.clipboard.writeText(outArea.value);
    } catch (e) {
      document.execCommand('copy');
    }

    const btn = document.getElementById('copy-btn');
    const prev = btn.innerText;
    btn.innerText = "Copied! ✓";
    btn.classList.add('btn-success');
    setTimeout(() => {
      btn.innerText = prev;
      btn.classList.remove('btn-success');
    }, 1400);
  }

  function loadSample() {
    rawInput.value = `// Secure greeting with Unicode & URLs
const apiEndpoint = "https://api.example.com/v1/auth";
const welcomeMessage = "नमस्ते! Welcome to the app 🚀";

function authenticateUser(token) {
  /* Verify token against endpoint */
  if (!token) {
    console.warn("Token not provided!");
    return false;
  }
  
  console.log(welcomeMessage);
  return { status: "active", endpoint: apiEndpoint };
}

authenticateUser("abc123secret");`;
    processRealtime();
  }

  window.addEventListener('DOMContentLoaded', () => {
    if (rawInput.value) processRealtime();
  });
</script>

</body>
</html>
