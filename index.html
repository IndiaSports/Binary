<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Binary Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1a1e29, #0a0c10);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #e2e8f0;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 255, 170, 0.05);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0, 255, 170, 0.12);
      color: #00ffaa;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 170, 0.25);
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      display: block;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    textarea {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px;
      color: #f0f6fc;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: vertical;
    }

    textarea:focus {
      border-color: #00ffaa;
      box-shadow: 0 0 0 3px rgba(0, 255, 170, 0.15);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin: 18px 0 22px 0;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-toggle {
      background: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
    }

    .btn-toggle.active {
      background: rgba(0, 255, 170, 0.15);
      color: #00ffaa;
      border-color: #00ffaa;
    }

    .btn-copy {
      background: #00ffaa;
      color: #0d1117;
    }

    .btn-copy:hover {
      background: #00dd95;
      transform: translateY(-1px);
    }

    .output-container {
      position: relative;
    }

    .output-box {
      background: #090d12;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      color: #58a6ff;
      min-height: 90px;
      max-height: 200px;
      overflow-y: auto;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .output-box.empty {
      color: #484f58;
      font-style: italic;
    }

    #copyToast {
      font-size: 12px;
      color: #00ffaa;
      margin-top: 8px;
      height: 16px;
      transition: opacity 0.2s;
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title">Binary Converter</div>
      <div class="badge">Universal UTF-8</div>
    </div>

    <label for="inputField">Plain Text Input</label>
    <textarea id="inputField" rows="3" placeholder="Type or paste any language, Sanskrit, emojis..." oninput="updateBinary()"></textarea>

    <div class="btn-group">
      <button id="toggleBtn" class="btn-toggle" onclick="toggleAIPrompt()">Prompt for AI: OFF</button>
      <button class="btn-copy" onclick="copyResult()">Copy Binary</button>
    </div>

    <label>Binary Stream Output</label>
    <div class="output-container">
      <div id="binaryBox" class="output-box empty">Converted 8-bit stream yahan aayega...</div>
      <div id="copyToast">Copied to clipboard!</div>
    </div>
  </div>

  <script>
    let isPromptEnabled = false;
    const AI_PREFIX = "01000100 01101111 01101110 00100111 01110100 00100000 01110100 01100101 01101100 01101101 01100101 00100000 00101110 00100000 01000100 01100101 01100011 01101111 01100100 01100101 01100100 00100000 01100010 01101001 01101110 01100001 01110010 01111001 00111010 00100000 00101110 00100000 01101010 01110101 01110011 01110100 00100000 01100100 01100101 01100011 01101111 01100100 01100101 00100000 01101001 01110100 00100000 01100001 01101110 01100100 00100000 01100001 01101110 01100100 00100000 01100111 01101001 01110110 01100101 00100000 01101101 01100101 00100000 01111001 01101111 01110101 01110010 00100000 01110010 01100101 01110011 01110000 01101111 01101110 01110011 01100101 00100000 01111110 00001010 00001010 ";

    const encoder = new TextEncoder();

    function toggleAIPrompt() {
      isPromptEnabled = !isPromptEnabled;
      const btn = document.getElementById("toggleBtn");
      
      if (isPromptEnabled) {
        btn.innerText = "Prompt for AI: ON";
        btn.classList.add("active");
      } else {
        btn.innerText = "Prompt for AI: OFF";
        btn.classList.remove("active");
      }
      
      updateBinary();
    }

    function updateBinary() {
      const input = document.getElementById("inputField").value;
      const display = document.getElementById("binaryBox");

      if (!input && !isPromptEnabled) {
        display.classList.add("empty");
        display.innerText = "Converted 8-bit stream yahan aayega...";
        return;
      }

      display.classList.remove("empty");

      // TextEncoder pure UTF-8 bytes generate karta hai (Global Multilingual support)
      const utf8Bytes = encoder.encode(input);
      const convertedText = Array.from(utf8Bytes)
        .map(byte => byte.toString(2).padStart(8, '0'))
        .join(' ');

      display.innerText = isPromptEnabled ? (AI_PREFIX + convertedText) : convertedText;
    }

    function copyResult() {
      const display = document.getElementById("binaryBox");
      const toast = document.getElementById("copyToast");
      const text = display.innerText;

      if (display.classList.contains("empty") || !text) {
        return;
      }

      const showToast = () => {
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 2000);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text)
          .then(showToast)
          .catch(() => fallbackCopy(text, showToast));
      } else {
        fallbackCopy(text, showToast);
      }
    }

    function fallbackCopy(text, callback) {
      const tempArea = document.createElement("textarea");
      tempArea.value = text;
      tempArea.style.position = "fixed";
      tempArea.style.left = "-9999px";
      document.body.appendChild(tempArea);
      tempArea.focus();
      tempArea.select();

      try {
        document.execCommand("copy");
        callback();
      } catch (err) {
        console.error("Copy failed: ", err);
      }

      document.body.removeChild(tempArea);
    }
  </script>

</body>
</html>
